<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bot-api playground</title>
<style>
  :root {
    --bg: #f6f4ee; --fg: #1d1c19; --muted: #6f6a5e; --rule: #dcd7ca; --panel: #fffdf8; --accent: #b98a2e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17161a; --fg: #ebe7dd; --muted: #9a958a; --rule: #2e2c33; --panel: #1f1e23; --accent: #d3b072; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, system-ui, sans-serif; }
  header { display: flex; align-items: baseline; gap: 1em; padding: 14px 20px; border-bottom: 1px solid var(--rule); }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .01em; }
  header span { color: var(--muted); font-size: 12px; }
  main { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 0; min-height: calc(100vh - 49px); }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  form { padding: 20px; border-right: 1px solid var(--rule); display: flex; flex-direction: column; gap: 14px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); letter-spacing: .03em; text-transform: uppercase; }
  textarea, select, input[type=text] { font: 16px/1.4 "Hiragino Mincho ProN", "Songti SC", serif; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); color: var(--fg); }
  select, input[type=text] { font-family: inherit; font-size: 14px; min-width: 0; width: 100%; }
  textarea { min-height: 96px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .check { flex-direction: row; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--fg); }
  button { font: 500 14px/1 inherit; padding: 10px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: progress; }
  button:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .meta { font-size: 12px; color: var(--muted); min-height: 1.5em; }
  section { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .themes { display: flex; gap: 6px; flex-wrap: wrap; }
  .themes button { background: transparent; color: var(--fg); border-color: var(--rule); padding: 6px 10px; font-size: 12px; }
  .themes button[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }

  /* host frames: what the same component looks like inside each app */
  .frame { border-radius: 10px; padding: 18px 20px; max-width: 560px; }
  .frame.neutral { background: var(--panel); border: 1px solid var(--rule); }
  .frame.yomi { background: rgba(16,15,20,.97); color: #ece7dc; border: 1px solid rgba(255,255,255,.08); box-shadow: 0 12px 40px rgba(0,0,0,.5);
    --ba-accent: #d3b072; --ba-muted: #9d9484; --ba-rule: rgba(255,255,255,.1); --ba-font-cjk: "Hiragino Mincho ProN", serif; }
  .frame.nantan { background: #1b2230; color: #e6ebf2; border: 1px solid #2c3648; border-radius: 12px;
    --ba-accent: #34d399; --ba-muted: #93a0b4; --ba-rule: #2c3648; --ba-font: Inter, -apple-system, system-ui, sans-serif; --ba-font-cjk: "Hiragino Sans", "Noto Sans CJK JP", sans-serif; }
  .frame.nantan-light { background: #ffffff; color: #111827; border: 1px solid #e5e7eb; border-radius: 12px;
    --ba-accent: #059669; --ba-muted: #6b7280; --ba-rule: #e5e7eb; --ba-font: Inter, -apple-system, system-ui, sans-serif; --ba-font-cjk: "Hiragino Sans", "Noto Sans CJK JP", sans-serif; }
  details { font-size: 12px; color: var(--muted); }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 10px; max-height: 40vh; overflow: auto; }
  .lookup { font-size: 12px; color: var(--muted); }
  .lookup b { color: var(--accent); font-weight: 500; }
</style>
</head>
<body>
<header><h1>bot-api playground</h1><span>POST /ask → &lt;bot-answer&gt;</span></header>
<main>
  <form id="f">
    <label>Sentence
      <textarea id="prompt" lang="ja">猫が窓の外を見ている。</textarea>
    </label>
    <div class="row">
      <label>Skill <select id="skill"><option value="">(none)</option></select></label>
      <label>Model <select id="model"><option value="">(skill / config)</option><option>sonnet</option><option>opus</option><option>fable</option><option>haiku</option></select></label>
    </div>
    <div class="row">
      <label>Effort <select id="effort"><option value="">(default)</option><option>low</option><option>medium</option><option>high</option><option>xhigh</option><option>max</option></select></label>
      <label>Thinking <select id="thinking"><option value="">(default)</option><option value="true">on</option><option value="false">off</option></select></label>
    </div>
    <label class="check"><input type="checkbox" id="component" checked> Component mode (typed tree)</label>
    <button id="go" type="submit">Explain</button>
    <div class="meta" id="meta"></div>
  </form>
  <section>
    <div class="themes" id="themes" role="group" aria-label="Host theme">
      <button type="button" data-theme="neutral" aria-pressed="true">neutral</button>
      <button type="button" data-theme="yomi">yomi-overlay</button>
      <button type="button" data-theme="nantan">nantan dark</button>
      <button type="button" data-theme="nantan-light">nantan light</button>
    </div>
    <div class="frame neutral" id="frame"><bot-answer id="answer"></bot-answer></div>
    <div class="lookup" id="lookup">Click a word in an explanation → the host gets a <code>lookup</code> event.</div>
    <details><summary>Raw response</summary><pre id="raw"></pre></details>
  </section>
</main>
<script src="/static/bot-answer.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const answer = $('answer');
  const SAMPLE = { component_version: '1', component: { type: 'explanation', source: '猫が窓の外を見ている。',
    translation: 'The cat is looking outside the window.',
    segments: [
      { surface: '猫', reading: 'ねこ', gloss: 'cat' }, { surface: 'が', gloss: 'subject', role: 'particle' },
      { surface: '窓', reading: 'まど', gloss: 'window' }, { surface: 'の', gloss: 'of', role: 'particle' },
      { surface: '外', reading: 'そと', gloss: 'outside' }, { surface: 'を', gloss: 'object', role: 'particle' },
      { surface: '見ている', reading: 'みている', base: '見る', gloss: 'is looking (at)' }, { surface: '。', gloss: '', role: 'punct' } ],
    grammar: [ { pattern: '〜ている', note: '見る + ている: an action in progress' }, { pattern: 'AのB', note: 'の links nouns: “outside of the window”' } ],
    style: 'plain, present progressive' } };
  answer.data = SAMPLE;

  fetch('/skills').then((r) => r.json()).then((skills) => {
    for (const s of skills) { const o = document.createElement('option'); o.value = s.name; o.textContent = s.name; o.title = s.description; $('skill').appendChild(o); }
    if (skills.some((s) => s.name === 'ja')) $('skill').value = 'ja';
  }).catch(() => {});

  $('themes').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-theme]'); if (!b) return;
    for (const x of $('themes').querySelectorAll('button')) x.setAttribute('aria-pressed', String(x === b));
    $('frame').className = `frame ${b.dataset.theme}`;
  });
  answer.addEventListener('lookup', (e) => {
    const d = e.detail; $('lookup').innerHTML = `lookup → <b>${d.surface}</b>${d.reading ? ` (${d.reading})` : ''}${d.base ? ` · dictionary form <b>${d.base}</b>` : ''}`;
  });

  $('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = { prompt: $('prompt').value, component: $('component').checked };
    if ($('skill').value) body.skill = $('skill').value;
    if ($('model').value) body.model = $('model').value;
    const thinking = {};
    if ($('effort').value) thinking.effort = $('effort').value;
    if ($('thinking').value) thinking.enabled = $('thinking').value === 'true';
    if (Object.keys(thinking).length) body.thinking = thinking;
    $('go').disabled = true; answer.loading = true; $('meta').textContent = 'asking…'; $('raw').textContent = '';
    const t0 = performance.now();
    try {
      const res = await fetch('/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json();
      answer.result = data; $('raw').textContent = JSON.stringify(data, null, 2);
      $('meta').textContent = data.ok
        ? `${data.model}${data.skill ? ' · ' + data.skill : ''} · ${(data.duration_ms / 1000).toFixed(1)} s · out ${data.usage.output_tokens} tok · thinking ${data.usage.thinking_tokens}${data.warnings.length ? ' · ⚠ ' + data.warnings.join('; ') : ''}`
        : `error: ${data.error.code}`;
    } catch (err) {
      answer.error = String(err); $('meta').textContent = `${((performance.now() - t0) / 1000).toFixed(1)} s`;
    } finally { $('go').disabled = false; }
  });
</script>
</body>
</html>
